<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuori stagione — dove conviene andare</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --carta:#f4f1ea;
    --inchiostro:#17130f;
    --seppia:#6d6255;
    --filo:#d8d0c1;
    --rosso:#a33a28;
    --verde:#3d6b4f;
    --oro:#9a7524;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--carta);
    color:var(--inchiostro);
    font-family:Inter,system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .foglio{max-width:1040px;margin:0 auto;padding:0 28px}

  /* ---------- TESTATA ---------- */
  .testata{border-bottom:3px double var(--inchiostro);padding:26px 0 14px;margin-bottom:0}

  .riga-alta{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--seppia);
    border-bottom:1px solid var(--filo);padding-bottom:10px;margin-bottom:18px;
  }

  .marchio{
    font-family:Fraunces,Georgia,serif;
    font-weight:400;
    font-size:clamp(38px,7vw,74px);
    line-height:.95;
    letter-spacing:-.02em;
    margin:0 0 14px;
  }

  .occhiello{
    font-family:Fraunces,Georgia,serif;
    font-size:clamp(17px,2.2vw,21px);
    font-weight:300;
    font-style:italic;
    color:var(--seppia);
    max-width:46ch;
    margin:0 0 20px;
  }

  /* ---------- STRUMENTI ---------- */
  .strumenti{padding:22px 0;border-bottom:1px solid var(--filo)}

  .etichetta{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--seppia);display:block;margin-bottom:8px;
  }

  .campo{
    width:100%;font:inherit;font-size:17px;
    background:transparent;color:var(--inchiostro);
    border:none;border-bottom:1.5px solid var(--inchiostro);
    padding:8px 0 10px;border-radius:0;
  }
  .campo::placeholder{color:#a79b8a}
  .campo:focus{outline:none;border-bottom-color:var(--rosso)}

  .mesi{display:flex;flex-wrap:wrap;gap:2px 0;margin-top:22px}

  .mesi button{
    font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    background:none;border:none;border-bottom:2px solid transparent;
    color:var(--seppia);padding:7px 13px 6px;cursor:pointer;
  }
  .mesi button:hover{color:var(--inchiostro)}
  .mesi button.attivo{color:var(--inchiostro);border-bottom-color:var(--rosso);font-weight:600}

  .priorita{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
    gap:16px 26px;margin-top:24px;
  }
  .leva label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--seppia);display:block;margin-bottom:2px}
  .leva output{color:var(--rosso);font-weight:600}
  .leva input[type=range]{width:100%;accent-color:var(--rosso);cursor:pointer}

  /* ---------- ARTICOLI ---------- */
  .conteggio{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--seppia);
    padding:22px 0 0;
  }

  .voce{
    display:grid;grid-template-columns:78px 1fr;gap:0 26px;
    padding:34px 0;border-bottom:1px solid var(--filo);
  }

  .posizione{
    font-family:Fraunces,serif;font-size:52px;line-height:.85;
    color:var(--filo);font-weight:400;
  }

  .nome{
    font-family:Fraunces,Georgia,serif;font-weight:400;
    font-size:clamp(30px,4.4vw,44px);line-height:1;letter-spacing:-.015em;
    margin:0 0 6px;
  }

  .luogo{
    font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--seppia);
    margin:0 0 16px;
  }

  .verdetto{
    display:inline-block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    font-weight:600;padding:4px 0;border-top:2px solid;border-bottom:1px solid var(--filo);
    margin-bottom:16px;
  }
  .verdetto.si{color:var(--verde);border-top-color:var(--verde)}
  .verdetto.forse{color:var(--oro);border-top-color:var(--oro)}
  .verdetto.no{color:var(--rosso);border-top-color:var(--rosso)}

  .sommario{
    font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:300;line-height:1.5;
    margin:0 0 20px;max-width:58ch;
  }
  .sommario b{font-weight:600}

  figure{margin:0 0 20px}
  figure img{width:100%;height:230px;object-fit:cover;display:block;filter:saturate(.85)}
  figcaption{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--seppia);padding-top:6px}

  .tabella{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
    border-top:1px solid var(--inchiostro);margin-bottom:20px;
  }
  .cella{padding:10px 14px 12px 0;border-right:1px solid var(--filo)}
  .cella:last-child{border-right:none}
  .cella dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--seppia);margin-bottom:3px}
  .cella dd{margin:0;font-family:Fraunces,serif;font-size:21px;font-weight:400}
  .cella dd small{font-size:12px;font-family:Inter,sans-serif;color:var(--seppia)}

  .note{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px 26px}
  .note h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--seppia);margin:0 0 3px;font-weight:600}
  .note p{margin:0;font-size:14.5px;line-height:1.5}

  .avviso{font-size:12px;color:var(--rosso);margin:14px 0 0;font-style:italic}

  .vuoto{padding:50px 0;font-family:Fraunces,serif;font-size:22px;font-weight:300;color:var(--seppia)}

  footer{
    border-top:3px double var(--inchiostro);margin-top:10px;padding:22px 0 56px;
    font-size:12px;color:var(--seppia);max-width:72ch;
  }

  @media(max-width:640px){
    .foglio{padding:0 20px}
    .voce{grid-template-columns:1fr;gap:0}
    .posizione{font-size:30px;margin-bottom:6px}
    figure img{height:180px}
  }
</style>
</head>

<body>

<div class="foglio">

  <header class="testata">
    <div class="riga-alta">
      <span>Guida alla bassa stagione</span>
      <span id="intestazione-mese">Gennaio</span>
    </div>
    <h1 class="marchio">Fuori stagione</h1>
    <p class="occhiello">Dove l'Europa costa la metà, mese per mese: quanto si spende, che tempo fa davvero, e cosa resta aperto la sera.</p>
  </header>

  <section class="strumenti">
    <label class="etichetta" for="cerca">Cerca una città, un mese, o entrambi</label>
    <input id="cerca" class="campo" type="search" autocomplete="off" placeholder="praga gennaio">

    <nav class="mesi" id="mesi"></nav>

    <div class="priorita" id="priorita"></div>
  </section>

  <p class="conteggio" id="conteggio"></p>

  <main id="lista"></main>

  <footer id="nota"></footer>

</div>

<script src="citta.js"></script>
<script>
  const mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno",
                "luglio","agosto","settembre","ottobre","novembre","dicembre"];

  let meseScelto = "gennaio";
  let cittaCercate = [];

  const pesi = { prezzo:2, caldo:2, sole:1, sicurezza:1, cibo:1 };
  const etichette = {
    prezzo:"Spendere poco", caldo:"Clima mite", sole:"Giorni di sole",
    sicurezza:"Sicurezza", cibo:"Mangiare a poco"
  };

  const boxMesi = document.getElementById("mesi");
  const boxPriorita = document.getElementById("priorita");
  const lista = document.getElementById("lista");
  const campo = document.getElementById("cerca");

  function normalizza(t){
    return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  }

  function prezzoDelMese(c, stagione){
    if(c.hotelBassa === null || c.hotelAlta === null) return null;
    if(stagione === "bassa") return c.hotelBassa;
    if(stagione === "alta")  return c.hotelAlta;
    return Math.round((c.hotelBassa + c.hotelAlta) / 2);
  }

  function risparmio(c, prezzo){
    return Math.round((1 - prezzo / c.hotelAlta) * 100);
  }

  function voto(v, min, max){
    return Math.max(0, Math.min(1, (v - min) / (max - min))) * 100;
  }

  function votiDi(c, mese){
    const m = c.mesi[mese];
    const p = prezzoDelMese(c, m.stagione);
    return {
      prezzo: p === null ? null : voto(200 - p, 0, 160),
      caldo: m.tmax >= 20 && m.tmax <= 28 ? 100 : (m.tmax > 28 ? voto(40 - m.tmax, 0, 12) : voto(m.tmax, -5, 20)),
      sole: voto(m.sole, 30, 340),
      sicurezza: c.sicurezza === null ? null : voto(c.sicurezza, 40, 80),
      cibo: c.pasto === null ? null : voto(20 - c.pasto, 0, 12)
    };
  }

  function punteggioDi(c, mese){
    const v = votiDi(c, mese);
    let somma = 0, totale = 0;
    for(const k in pesi){
      if(v[k] === null) continue;
      somma += v[k] * pesi[k];
      totale += pesi[k];
    }
    return totale === 0 ? 0 : Math.round(somma / totale);
  }

  // Invece del voto numerico, un verdetto a parole: si ricorda e si racconta meglio.
  function verdetto(punti, stagione){
    if(punti >= 72) return { testo:"Ci vado subito", classe:"si" };
    if(punti >= 58) return { testo:"Buon affare", classe:"forse" };
    if(stagione === "alta") return { testo:"Aspetta la bassa stagione", classe:"no" };
    return { testo:"Solo se ti va bene così", classe:"no" };
  }

  // Una frase costruita dai dati, diversa per ogni città e per ogni mese.
  function sommario(c, mese){
    const m = c.mesi[mese];
    const p = prezzoDelMese(c, m.stagione);
    const v = votiDi(c, mese);
    const pezzi = [];

    if(p !== null){
      const sc = risparmio(c, p);
      pezzi.push(sc > 0
        ? `Si dorme con <b>${p} €</b>, il <b>${sc}%</b> in meno che in alta stagione`
        : `Si dorme con <b>${p} €</b>, ed è il periodo più caro dell'anno`);
    } else {
      pezzi.push("I prezzi degli hotel non sono ancora stati rilevati");
    }

    if(m.tmax >= 20 && m.tmax <= 28) pezzi.push(`si sta fuori con <b>${m.tmax}°</b>`);
    else if(m.tmax > 28) pezzi.push(`fa caldo, <b>${m.tmax}°</b> di massima`);
    else if(m.tmax < 6) pezzi.push(`fa freddo davvero, <b>${m.tmax}°</b> di massima`);
    else pezzi.push(`la massima si ferma a <b>${m.tmax}°</b>`);

    if(v.sole > 70) pezzi.push(`e il sole non manca (${m.sole} ore nel mese)`);
    else if(v.sole < 30) pezzi.push(`con poco sole, appena ${m.sole} ore in tutto il mese`);

    return pezzi.join(", ") + ".";
  }

  // --- cursori ---
  for(const criterio in pesi){
    const leva = document.createElement("div");
    leva.className = "leva";
    leva.innerHTML =
      '<label>' + etichette[criterio] + ' <output id="out-'+criterio+'">'+pesi[criterio]+'</output></label>' +
      '<input type="range" min="0" max="3" step="1" value="'+pesi[criterio]+'">';
    boxPriorita.appendChild(leva);
    leva.querySelector("input").addEventListener("input", function(){
      pesi[criterio] = Number(this.value);
      document.getElementById("out-"+criterio).textContent = this.value;
      disegna();
    });
  }

  // --- mesi ---
  mesi.forEach(function(mese){
    const b = document.createElement("button");
    b.textContent = mese;
    b.addEventListener("click", function(){ meseScelto = mese; disegnaMesi(); disegna(); });
    boxMesi.appendChild(b);
  });

  function disegnaMesi(){
    boxMesi.querySelectorAll("button").forEach(function(b){
      b.classList.toggle("attivo", b.textContent === meseScelto);
    });
    document.getElementById("intestazione-mese").textContent =
      meseScelto.charAt(0).toUpperCase() + meseScelto.slice(1);
  }

  // --- ricerca ---
  campo.addEventListener("input", function(){
    const parole = normalizza(campo.value).split(/\s+/).filter(Boolean);
    cittaCercate = [];
    parole.forEach(function(parola){
      if(parola.length < 3) return;
      const mese = mesi.find(function(m){ return m.startsWith(parola); });
      if(mese){ meseScelto = mese; return; }
      citta.forEach(function(c){
        if(normalizza(c.nome).startsWith(parola) && !cittaCercate.includes(c.nome)) cittaCercate.push(c.nome);
      });
    });
    disegnaMesi();
    disegna();
  });

  // --- articoli ---
  function disegna(){
    let scelte = citta.slice();
    if(cittaCercate.length > 0){
      scelte = scelte.filter(function(c){ return cittaCercate.includes(c.nome); });
    }
    scelte.sort(function(a,b){ return punteggioDi(b, meseScelto) - punteggioDi(a, meseScelto); });

    lista.innerHTML = "";
    document.getElementById("conteggio").textContent =
      scelte.length + (scelte.length === 1 ? " città" : " città") + " · in ordine di quanto ti convengono";

    if(scelte.length === 0){
      lista.innerHTML = '<p class="vuoto">Nessuna città con questo nome.</p>';
      return;
    }

    scelte.forEach(function(c, i){
      const m = c.mesi[meseScelto];
      const p = prezzoDelMese(c, m.stagione);
      const punti = punteggioDi(c, meseScelto);
      const ver = verdetto(punti, m.stagione);
      const notte = m.stagione === "alta" ? c.notteAlta : c.notteBassa;

      const figura = c.foto
        ? `<figure><img src="${c.foto}" alt="${c.nome}" loading="lazy"><figcaption>${c.nome}, ${c.paese}</figcaption></figure>`
        : "";

      const avviso = p === null
        ? '<p class="avviso">Scheda incompleta: prezzi degli hotel ancora da rilevare.</p>'
        : (c.prezziRilevati ? "" : '<p class="avviso">Prezzi stimati, non ancora verificati su Booking.</p>');

      lista.innerHTML += `
        <article class="voce">
          <div class="posizione">${String(i+1).padStart(2,"0")}</div>
          <div>
            <h2 class="nome">${c.nome}</h2>
            <p class="luogo">${c.paese} &nbsp;·&nbsp; ${meseScelto} &nbsp;·&nbsp; stagione ${m.stagione}</p>

            <div class="verdetto ${ver.classe}">${ver.testo}</div>

            ${figura}

            <p class="sommario">${sommario(c, meseScelto)}</p>

            <dl class="tabella">
              <div class="cella"><dt>Notte</dt><dd>${p === null ? "—" : p + " <small>€</small>"}</dd></div>
              <div class="cella"><dt>Temperature</dt><dd>${m.tmin}/${m.tmax}<small>°</small></dd></div>
              <div class="cella"><dt>Ore di sole</dt><dd>${m.sole}<small>h</small></dd></div>
              <div class="cella"><dt>Pasto</dt><dd>${c.pasto === null ? "—" : c.pasto + " <small>€</small>"}</dd></div>
              <div class="cella"><dt>Birra</dt><dd>${c.birra === null ? "—" : c.birra + " <small>€</small>"}</dd></div>
              <div class="cella"><dt>Sicurezza</dt><dd>${c.sicurezza === null ? "—" : c.sicurezza}<small>/100</small></dd></div>
            </dl>

            <div class="note">
              <div><h4>Da vedere</h4><p>${c.vedere.join(" · ")}</p></div>
              <div><h4>A tavola</h4><p>${c.mangiare.join(" · ")}</p></div>
              ${notte ? `<div><h4>La sera</h4><p>${notte}</p></div>` : ""}
            </div>

            ${avviso}
          </div>
        </article>
      `;
    });
  }

  document.getElementById("nota").textContent =
    "Clima: medie degli ultimi dieci anni, da Open-Meteo. Sicurezza e prezzi di cibo e bevande: Numbeo 2026. " +
    "I prezzi degli hotel sono rilevati a mano dove indicato, altrove stimati: verifica sempre prima di prenotare.";

  disegnaMesi();
  disegna();
</script>

</body>
</html>
